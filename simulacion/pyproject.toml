[project]
name = "grafos-proyecto"
version = "0.1.0"
description = "Pipeline experimental de cobertura poblacional con topografía de Chile"
requires-python = ">=3.12"
dependencies = [
  "geopandas>=1.0,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2,<3",
  "pyproj>=3.6,<4",
  "rasterio>=1.4,<2",
  "shapely>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
