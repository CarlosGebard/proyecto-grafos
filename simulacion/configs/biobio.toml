# Piloto cercano a Yumbel: ventana de unos 18 × 22 km; no toda la región.
region = "biobio"
bbox = [-72.65, -37.30, -72.45, -37.10]
k = 5
max_distance_m = 30000.0
antenna_height_m = 30.0
receiver_height_m = 1.5

# Generación por criterio (ADR 0007). El tope mantiene el grafo dentro del
# presupuesto de pares LOS; el puntaje prioriza población alcanzable.
max_candidates = 40
max_evaluations = 2000000
dem_source = "alos"
hypsometric_palette = "warm_humid"
output = "outputs/biobio"
