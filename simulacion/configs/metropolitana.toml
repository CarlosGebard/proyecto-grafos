# Piloto rural de Paine/Buin; no toda la Región Metropolitana.
# Si se dispone de ALOS local, sustituir por dem = "ruta/al/DEM.jp2".
region = "metropolitana"
bbox = [-70.95, -33.85, -70.75, -33.65]
dem_source = "copernicus"
hypsometric_palette = "arid"
k = 5
max_distance_m = 30000.0
antenna_height_m = 30.0
receiver_height_m = 1.5

# Generación por criterio (ADR 0007). El tope mantiene el grafo dentro del
# presupuesto de pares LOS; el puntaje prioriza población alcanzable.
max_candidates = 40
max_evaluations = 2000000
output = "outputs/metropolitana"
